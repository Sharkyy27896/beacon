name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/Beacon/Beacon.csproj -r win-x64

      - name: Build
        run: dotnet build src/Beacon/Beacon.csproj -c Release --no-restore

      - name: Publish (self-contained win-x64)
        run: dotnet publish src/Beacon/Beacon.csproj -c Release -r win-x64 --self-contained true -o publish/Beacon --no-restore

      - name: Build themed installer
        shell: pwsh
        run: ./tools/build_installer.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beacon-Setup
          path: Beacon-Setup.exe
          if-no-files-found: error
